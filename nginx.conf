# ════════════════════════════════════════════════════
#  G3NE5IS nginx.conf
#  www → non-www 301 pro CZ / SK / PL
#  Admin chráněn HTTP Basic Auth
# ════════════════════════════════════════════════════

# ─── www.genesis-invest.cz → genesis-invest.cz ───
server {
    listen 80;
    server_name www.genesis-invest.cz;
    return 301 https://genesis-invest.cz$request_uri;
}

# ─── www.genesis-invest.sk → genesis-invest.sk ───
server {
    listen 80;
    server_name www.genesis-invest.sk;
    return 301 https://genesis-invest.sk$request_uri;
}

# ─── www.genesis-invest.pl → genesis-invest.pl ───
server {
    listen 80;
    server_name www.genesis-invest.pl;
    return 301 https://genesis-invest.pl$request_uri;
}

# ─── Hlavní server — obsluhuje všechny 3 domény ───
server {
    listen 80;
    server_name genesis-invest.cz genesis-invest.sk genesis-invest.pl _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Bezpečnostní hlavičky
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml
               application/rss+xml font/woff font/woff2;
    gzip_min_length 1000;

    # ═══ ADMIN — server-side HTTP Basic Auth ═══
    location = /admin.html {
        auth_basic "G3NE5IS Admin — Privátní přístup";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ═══ SEO — sitemap.xml ═══
    location = /sitemap.xml {
        try_files $uri =404;
        add_header Content-Type "application/xml; charset=utf-8";
    }

    # ═══ SEO — robots.txt ═══
    location = /robots.txt {
        try_files $uri =404;
        add_header Content-Type "text/plain; charset=utf-8";
        access_log off;
    }

    # ═══ Veřejný web ═══
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ═══ Cache — obrázky a fonty ═══
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ═══ Cache — CSS a JS ═══
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    error_page 404 /index.html;
}
