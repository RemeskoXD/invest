server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ═══ Bezpečnostní hlavičky ═══
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ═══ Gzip komprese ═══
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # ═══ ADMIN PANEL — chráněn heslem na úrovni serveru ═══
    location = /admin.html {
        auth_basic "G3NE5IS Admin — Privátní přístup";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri =404;

        # Zakázat indexaci adminstrační stránky
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ═══ Veřejná část webu ═══
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ═══ Cache pro statické assety ═══
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ═══ Skrýt nginx verzi v chybách ═══
    server_tokens off;

    # ═══ 404 → index.html (SPA fallback) ═══
    error_page 404 /index.html;
}
